services:
  db:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${DB_DATABASE:-company_ai}
      POSTGRES_USER: ${DB_USERNAME:-company_ai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      target: production
    image: company-ai-app:${IMAGE_TAG:-local}
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DEV_LOGIN_ENABLED: "false"
      SESSION_SECURE_COOKIE: "true"
      DB_HOST: db
    volumes:
      - uploads:/app/storage/app/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    image: company-ai-app:${IMAGE_TAG:-local}
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DEV_LOGIN_ENABLED: "false"
      DB_HOST: db
    command: [worker]
    volumes:
      - uploads:/app/storage/app/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, worker-health]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 75s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    image: company-ai-web:${IMAGE_TAG:-local}
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/up']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  database:
  uploads:
