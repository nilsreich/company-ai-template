name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Start development containers from an empty database
        run: ./bin/dev init
      - name: Format, static analysis, PHPUnit and Composer security audit
        run: ./bin/dev check
      - name: Frontend audit and browser installation
        run: |
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Browser flows with real database worker
        run: npm run test:e2e
      - name: Build production images
        run: docker compose build app web
      - name: Interruption, persistence, fresh production start and restore
        run: php tests/operations/lifecycle.php
      - name: Browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            playwright-report
            test-results
      - name: Stop containers
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down
